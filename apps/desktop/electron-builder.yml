# Unsigned local macOS identity. `scripts/package-mac.ts` materializes the
# authoritative electron-builder JSON against the staged app directory so
# electron-builder does not walk the workspace package graph.
#
# Local `bun run package:mac` keeps identity null and hardened runtime off.
# `bun run package:mac:proof` uses `scripts/mac-packaging-config.ts` instead:
# Developer ID, hardened runtime, notarization, DMG/ZIP, and fail-closed
# credentials. Do not set identity here; a null identity in this file is the
# unsigned local default, not a public artifact.
appId: dev.vietfood.phocode
productName: Pho Code
electronVersion: 43.4.0
copyright: Copyright 2026 Pho Code

directories:
  output: release
  app: .package-stage
  buildResources: resources

files:
  - "**/*"

asar: true
asarUnpack:
  - "**/*.node"
  - "**/*.wasm"
  - "**/*.dylib"
  - "**/*.so"
  - "**/node_modules/@silvia-odwyer/photon-node/**/*"
  - "**/node_modules/@ff-labs/**/*"
  - "**/node_modules/ffi-rs/**/*"

extraResources:
  - from: resources/features
    to: features
  - from: resources/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt

npmRebuild: false
nodeGypRebuild: false

mac:
  identity: null
  category: public.app-category.developer-tools
  target:
    - dir
  darkModeSupport: true
  hardenedRuntime: false
  gatekeeperAssess: false

artifactName: ${productName}-${version}-${arch}.${ext}
